version: 2
updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor bumps are low-risk and get bundled into one PR per run so
      # the auto-merge pipeline doesn't have to churn through a PR per package.
      # Major bumps are kept separate since they need manual review anyway.
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Base image updates for the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  # Actions used in our own workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Higher than the default of 5: we reference more than 5 distinct
    # actions across our workflows, and a tight cap previously queued
    # actions/checkout and actions/setup-node behind other updates for a
    # full cycle instead of surfacing all outdated actions at once.
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore(ci)"
